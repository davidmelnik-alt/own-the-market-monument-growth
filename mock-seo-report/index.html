<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fb">
  <title>SEO Visibility Report — Monument Growth</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f7f8fb; color: #172033; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: clamp(16px, 4vw, 48px); }
    main { width: min(100%, 1500px); }
    h1 { margin: 0 0 16px; font-size: clamp(20px, 3vw, 30px); font-weight: 650; letter-spacing: -.03em; }
    a { display: block; border-radius: 12px; overflow: hidden; box-shadow: 0 12px 40px rgb(22 34 58 / 12%); background: white; }
    img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <main>
    <h1>SEO Visibility Report</h1>
    <a href="report.png" aria-label="Open the full-size SEO visibility report image">
      <img src="report.png" alt="Comparison of baseline and current local search rankings, showing ranking improvement and top-three placements." width="1498" height="1050">
    </a>
  </main>
</body>
</html>
